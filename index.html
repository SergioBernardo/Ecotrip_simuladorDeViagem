<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Emissão de CO2</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🍃 Calculadora de Emissão de CO2</h1>
        <p>Calcule as emissões de CO2 da sua viagem e descubra o impacto ambiental do seu deslocamento.</p>
    </header>

    <main>
        <form id="calculator-form">
            <div class="form-group">
                <label for="origin">Origem:</label>
                <input type="text" id="origin" name="origin" list="routes" required>
            </div>

            <div class="form-group">
                <label for="destination">Destino:</label>
                <input type="text" id="destination" name="destination" list="routes" required>
            </div>

            <datalist id="routes">
                <!-- Routes will be populated by JavaScript -->
            </datalist>

            <div class="form-group">
                <label for="distance">Distância (km):</label>
                <input type="number" id="distance" name="distance" step="0.01" required readonly>
                <small>A distância será preenchida automaticamente</small>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="round-trip" name="round-trip">
                    Ida e Volta
                </label>
            </div>

            <fieldset class="transport-mode">
                <legend>Modo de Transporte:</legend>
                <div class="transport-grid">
                    <label class="transport-option">
                        <input type="radio" name="transport" value="bicycle">
                        <span>🚴 Bicicleta</span>
                    </label>
                    <label class="transport-option">
                        <input type="radio" name="transport" value="car" checked>
                        <span>🚗 Carro</span>
                    </label>
                    <label class="transport-option">
                        <input type="radio" name="transport" value="bus">
                        <span>🚌 Ônibus</span>
                    </label>
                    <label class="transport-option">
                        <input type="radio" name="transport" value="truck">
                        <span>🚚 Caminhão</span>
                    </label>
                </div>
            </fieldset>

            <button type="submit" class="btn-calculate">Calcular Emissão</button>
        </form>

        <section id="results" class="hidden">
            <div></div>
        </section>

        <section id="comparison" class="hidden">
            <div></div>
        </section>

        <section id="carbon-credits" class="hidden">
            <div></div>
        </section>
    </main>

    <footer>
        <p>Desenvolvido com ❤️ por Samuel</p>
    </footer>

    <script src="js/routes-data.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
